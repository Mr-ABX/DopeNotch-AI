[package]
name = "dopenotch"
version = "0.4.0"
description = "DopeNotch AI - 'cause it's top-notch. Ultra-fast on-device voice dictation, notch AI assistant & clipboard shelf"
authors = ["DopeNotch AI Team"]
license = "MIT"
repository = "https://github.com/Mr-ABX/DopeNotch-AI"
edition = "2021"
rust-version = "1.75"
default-run = "dopenotch"

[lib]
name = "dopenotch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"

[dependencies]
# Tauri core
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Audio capture (cross-platform)
cpal = "0.15"

# Keyboard simulation for auto-paste (cross-platform)
enigo = { version = "0.2", features = [] }

# whisper.cpp bindings
whisper-rs = { version = "=0.11.1", features = [] }

# Global hotkey (used as fallback/alternative)
rdev = "0.5"

# HTTP for model download and APIs
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }
futures-util = "0.3"
base64 = "0.22"
hound = "3.5"

# CPU thread count for inference
num_cpus = "1"

# Regex for VoxCoder mode text transformations
regex = "1"

# Paths
dirs = "5"

# Error handling
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# UUID for session IDs
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
